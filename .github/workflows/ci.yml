name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Audit Python dependencies
        run: pip-audit
      - name: Test
        run: pytest

  deploy:
    # Render's GitHub push integration is unreliable for this service, so a
    # green test run on main triggers Render through its deploy hook instead.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret not set; skipping Render deploy"
            exit 0
          fi
          # Deploy this exact commit; print Render's reply (never the hook URL) on failure.
          status=$(curl --silent --show-error --max-time 30 -o response.txt -w "%{http_code}" \
            -X POST "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}")
          if [ "$status" -ge 400 ]; then
            echo "::error::Render deploy hook returned HTTP $status"
            head -c 500 response.txt; echo
            exit 1
          fi
          echo "Render deploy triggered for ${GITHUB_SHA::7} (HTTP $status)"
