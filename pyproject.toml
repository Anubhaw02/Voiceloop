[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-brand-agent"
version = "0.1.0"
description = "Local-first Cloud x AI research, briefing, drafting, and approval pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "httpx>=0.28,<1",
  "feedparser>=6.0.11,<7",
  "PyYAML>=6.0.2,<7",
  "APScheduler>=3.10.4,<4",
  "Jinja2>=3.1.4,<4",
  "python-multipart>=0.0.20,<1",
]

[project.scripts]
brand-agent = "brand_agent.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["brand_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

